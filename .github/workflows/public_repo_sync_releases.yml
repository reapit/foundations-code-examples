name: Sync Release to Public Repo
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag of the release to copy'
        required: true
        type: string

jobs:
  sync-release:
    uses: reapit-global/uk-devops-reusable-workflows/.github/workflows/public_repo_sync_releases.yml@ACP-4169 
    secrets: inherit
    with:
      release_tag: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}
      public_org: "reapit"
      public_repo: "foundations-code-examples"